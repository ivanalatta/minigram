# Orquesta los servicios para producción (en desarrollo local
# corremos frontend y backend directo, sin Docker).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minigram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: minigram
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://minigram:${POSTGRES_PASSWORD}@db:5432/minigram
      SECRET_KEY: ${SECRET_KEY:?definir en .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: https://${DOMAIN}
    volumes:
      - uploads:/code/uploads
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?definir en .env}
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  # Solo se ejecuta a mano (emitir/renovar certificados), no con `up`:
  #   docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  pgdata:
  uploads:
  certbot-www:
  letsencrypt:
